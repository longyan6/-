        "xiangLocator": "周易/蒙/象/九二",
        "status": "checked"
      },

        "label": "六三",
        "text": "六三：勿用取女，见金夫，不有躬，无攸利。",

    "tuan": "需，须也，险在前也；刚健而不陷，其义不困穷矣。需，有孚，光亨，贞吉，位乎天位，以正中也。利涉大川，往有功也。",

        "sourceLocator": "周易/需/易经/九二",
        "xiangLocator": "周易/需/象/九二",
        "status": "checked"

      {

        "label": "九三",
        "text": "九三：需于泥，致寇至。",

        "xiangLocator": "周易/需/象/六四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "九五",
        "text": "九五：需于酒食，贞吉。",
        "xiang": "酒食，贞吉，以中正也。",

        "xiangLocator": "周易/需/象/九五",

        "status": "checked"

        "text": "六三：食旧德，贞厉，终吉。或从王事，无成。",

    "guaci": "泰：小往大来，吉亨。",
    "tuan": "泰，小往大来，吉亨。则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也。",

        "xiangLocator": "周易/泰/象/九二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "九三",
        "text": "九三：无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。",

        "sourceLocator": "周易/泰/易经/九三",
        "xiangLocator": "周易/泰/象/九三",
        "status": "checked"

        "label": "六四",
        "text": "六四：翩翩，不富以其邻；不戒以孚。",
        "xiang": "翩翩不富，皆失实也。不戒以孚，中心愿也。",

        "xiangLocator": "周易/泰/象/六四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "六五",
        "text": "六五：帝乙归妹，以祉，元吉。",

        "xiangLocator": "周易/泰/象/上六",

      }

        "text": "初九：悔亡，丧马勿逐，自复；见恶人无咎。",

      {
        "position": 2,
        "label": "九二",

        "sourceLocator": "周易/睽/易经/九二",
        "xiangLocator": "周易/睽/象/九二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "六三",
        "text": "六三：见舆曳，其牛掣，其人天且劓，无初有终。",
        "xiang": "见舆曳，位不当也。无初有终，遇刚也。",
        "sourceLocator": "周易/睽/易经/六三",
        "xiangLocator": "周易/睽/象/六三",
        "status": "checked"
      },
      {
        "position": 4,
        "label": "九四",
        "text": "九四：睽孤，遇元夫，交孚，厉无咎。",
        "xiang": "交孚无咎，志行也。",
        "sourceLocator": "周易/睽/易经/九四",
        "xiangLocator": "周易/睽/象/九四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "六五",
        "text": "六五：悔亡，厥宗噬肤，往何咎。",
        "xiang": "厥宗噬肤，往有庆也。",
        "sourceLocator": "周易/睽/易经/六五",
        "xiangLocator": "周易/睽/象/六五",
        "status": "checked"
      },
      {
        "position": 6,
        "label": "上九",
        "text": "上九：睽孤， 见豕负涂，载鬼一车， 先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。",
        "xiang": "遇雨之吉，群疑亡也。",
        "sourceLocator": "周易/睽/易经/上九",
        "xiangLocator": "周易/睽/象/上九",
        "status": "checked"
      }

  {
    "number": 39,
    "name": "蹇",
    "guaci": "蹇：利西南，不利东北；利见大人，贞吉。",
    "tuan": "蹇，难也，险在前也。见险而能止，知矣哉！蹇利西南，往得中也；不利东北，其道穷也。利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉！",
    "daxiang": "山上有水，蹇；君子以反身修德。",
    "lines": [
      {
        "position": 1,
        "label": "初六",
        "text": "初六：往蹇，来誉。",
        "xiang": "往蹇来誉，宜待也。",
        "sourceLocator": "周易/蹇/易经/初六",
        "xiangLocator": "周易/蹇/象/初六",
        "status": "checked"
      },
      {
        "position": 2,
        "label": "六二",
        "text": "六二：王臣蹇蹇，匪躬之故。",
        "xiang": "王臣蹇蹇，终无尤也。",
        "sourceLocator": "周易/蹇/易经/六二",
        "xiangLocator": "周易/蹇/象/六二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "九三",
        "text": "九三：往蹇来反。",
        "xiang": "往蹇来反，内喜之也。",
        "sourceLocator": "周易/蹇/易经/九三",
        "xiangLocator": "周易/蹇/象/九三",
        "status": "checked"
      },
      {
        "position": 4,
        "label": "六四",
        "text": "六四：往蹇来连。",
        "xiang": "往蹇来连，当位实也。",
        "sourceLocator": "周易/蹇/易经/六四",
        "xiangLocator": "周易/蹇/象/六四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "九五",
        "text": "九五：大蹇朋来。",
        "xiang": "大蹇朋来，以中节也。",
        "sourceLocator": "周易/蹇/易经/九五",
        "xiangLocator": "周易/蹇/象/九五",
        "status": "checked"
      },
      {
        "position": 6,
        "label": "上六",
        "text": "上六：往蹇来硕，吉；利见大人。",
        "xiang": "往蹇来硕，志在内也。利见大人，以从贵也。",
        "sourceLocator": "周易/蹇/易经/上六",
        "xiangLocator": "周易/蹇/象/上六",
        "status": "checked"
      }

  {
    "number": 40,
    "name": "解",
    "guaci": "解：利西南，无所往，其来复吉。有攸往，夙吉。",
    "tuan": "解，险以动，动而免乎险，解。解利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也。天地解，而雷雨作，雷雨作，而百果草木皆甲坼，解之时义大矣哉！",
    "daxiang": "雷雨作，解；君子以赦过宥罪。",
    "lines": [
      {
        "position": 1,
        "label": "初六",
        "text": "初六：无咎。",
        "xiang": "刚柔之际，义无咎也。",
        "sourceLocator": "周易/解/易经/初六",
        "xiangLocator": "周易/解/象/初六",
        "status": "checked"
      },
      {
        "position": 2,
        "label": "九二",
        "text": "九二：田获三狐，得黄矢，贞吉。",
        "xiang": "九二贞吉，得中道也。",
        "sourceLocator": "周易/解/易经/九二",
        "xiangLocator": "周易/解/象/九二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "六三",
        "text": "六三：负且乘，致寇至，贞吝。",
        "xiang": "负且乘，亦可丑也，自我致戎，又谁咎也。",
        "sourceLocator": "周易/解/易经/六三",
        "xiangLocator": "周易/解/象/六三",
        "status": "checked"
      },
      {
        "position": 4,
        "label": "九四",
        "text": "九四：解而拇，朋至斯孚。",
        "xiang": "解而拇，未当位也。",
        "sourceLocator": "周易/解/易经/九四",
        "xiangLocator": "周易/解/象/九四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "六五",
        "text": "六五：君子维有解，吉；有孚于小人。",
        "xiang": "君子有解，小人退也。",
        "sourceLocator": "周易/解/易经/六五",
        "xiangLocator": "周易/解/象/六五",
        "status": "checked"
      },
      {
        "position": 6,
        "label": "上六",
        "text": "上六：公用射隼，于高墉之上，获之，无不利。",
        "xiang": "公用射隼，以解悖也。",
        "sourceLocator": "周易/解/易经/上六",
        "xiangLocator": "周易/解/象/上六",
        "status": "checked"
      }
    ],

  {
    "number": 41,
    "name": "损",
    "guaci": "损：有孚，元吉。无咎，可贞，利有攸往。曷之用？二簋可用享。",
    "tuan": "损，损下益上，其道上行。损而有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享；二簋应有时。损刚益柔有时，损益盈虚，与时偕行。",
    "daxiang": "山下有泽，损；君子以惩忿窒欲。",
    "lines": [
      {
        "position": 1,
        "label": "初九",
        "text": "初九：已事遄往，无咎，酌损之。",
        "xiang": "已事遄往，尚合志也。",
        "sourceLocator": "周易/损/易经/初九",
        "xiangLocator": "周易/损/象/初九",
        "status": "checked"
      },
      {
        "position": 2,
        "label": "九二",
        "text": "九二：利贞，征凶，弗损益之。",
        "xiang": "九二利贞，中以为志也。",
        "sourceLocator": "周易/损/易经/九二",
        "xiangLocator": "周易/损/象/九二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "六三",
        "text": "六三：三人行，则损一人；一人行，则得其友。",
        "xiang": "一人行，三则疑也。",
        "sourceLocator": "周易/损/易经/六三",
        "xiangLocator": "周易/损/象/六三",
        "status": "checked"
      },
      {
        "position": 4,
        "label": "六四",
        "text": "六四：损其疾，使遄有喜，无咎。",
        "xiang": "损其疾，亦可喜也。",
        "sourceLocator": "周易/损/易经/六四",
        "xiangLocator": "周易/损/象/六四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "六五",
        "text": "六五：或益之，十朋之龟弗克违，元吉。",
        "xiang": "六五元吉，自上佑也。",
        "sourceLocator": "周易/损/易经/六五",
        "xiangLocator": "周易/损/象/六五",
        "status": "checked"
      },
      {
        "position": 6,
        "label": "上九",
        "text": "上九：弗损益之，无咎，贞吉，利有攸往，得臣无家。",
        "xiang": "弗损益之，大得志也。",
        "sourceLocator": "周易/损/易经/上九",
        "xiangLocator": "周易/损/象/上九",
        "status": "checked"
      }

  {
    "number": 42,
    "name": "益",
    "guaci": "益：利有攸往。利涉大川。",
    "tuan": "益，损上益下，民说无疆，自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。",
    "daxiang": "风雷，益；君子以见善则迁，有过则改。",
    "lines": [
      {
        "position": 1,
        "label": "初九",
        "text": "初九：利用为大作，元吉，无咎。",
        "xiang": "元吉无咎，下不厚事也。",
        "sourceLocator": "周易/益/易经/初九",
        "xiangLocator": "周易/益/象/初九",
        "status": "checked"
      },
      {
        "position": 2,
        "label": "六二",
        "text": "六二：或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。",
        "xiang": "或益之，自外来也。",
        "sourceLocator": "周易/益/易经/六二",
        "xiangLocator": "周易/益/象/六二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "六三",
        "text": "六三：益之用凶事，无咎。有孚中行，告公用圭。",
        "xiang": "益用凶事，固有之也。",
        "sourceLocator": "周易/益/易经/六三",
        "xiangLocator": "周易/益/象/六三",
        "status": "checked"
      },
      {
        "position": 4,
        "label": "六四",
        "text": "六四：中行，告公从。利用为依迁国。",
        "xiang": "告公从，以益志也。",
        "sourceLocator": "周易/益/易经/六四",
        "xiangLocator": "周易/益/象/六四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "九五",
        "text": "九五：有孚惠心，勿问元吉。有孚惠我德。",
        "xiang": "有孚惠心，勿问之矣。惠我德，大得志也。",
        "sourceLocator": "周易/益/易经/九五",
        "xiangLocator": "周易/益/象/九五",
        "status": "checked"
      },
      {
        "position": 6,
        "label": "上九",
        "text": "上九：莫益之，或击之，立心勿恒，凶。",
        "xiang": "莫益之，偏辞也。或击之，自外来也。",
        "sourceLocator": "周易/益/易经/上九",
        "xiangLocator": "周易/益/象/上九",
        "status": "checked"
      }
    ],

  {

    "name": "夬",

    "tuan": "夬，决也，刚决柔也。健而说，决而和，扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。",
    "daxiang": "泽上于天，夬；君子以施禄及下，居德则忌。",
    "lines": [
      {
        "position": 1,
        "label": "初九",
        "text": "初九：壮于前趾，往不胜为咎。",
        "xiang": "不胜而往，咎也。",
        "sourceLocator": "周易/夬/易经/初九",
        "xiangLocator": "周易/夬/象/初九",
        "status": "checked"
      },
      {
        "position": 2,
        "label": "九二",
        "text": "九二：惕号，莫夜有戎，勿恤。",
        "xiang": "莫夜有戎，得中道也。",
        "sourceLocator": "周易/夬/易经/九二",
        "xiangLocator": "周易/夬/象/九二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "九三",
        "text": "九三：壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。",
        "xiang": "君子夬夬，终无咎也。",
        "sourceLocator": "周易/夬/易经/九三",
        "xiangLocator": "周易/夬/象/九三",
        "status": "checked"
      },
      {
        "position": 4,
        "label": "九四",
        "text": "九四：臀无肤，其行次且。牵羊悔亡，闻言不信。",
        "xiang": "其行次且，位不当也。闻言不信，聪不明也。",
        "sourceLocator": "周易/夬/易经/九四",
        "xiangLocator": "周易/夬/象/九四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "九五",
        "text": "九五：苋陆夬夬，中行无咎。",
        "xiang": "中行无咎，中未光也。",
        "sourceLocator": "周易/夬/易经/九五",
        "xiangLocator": "周易/夬/象/九五",
        "status": "checked"
      },
      {
        "position": 6,
        "label": "上六",
        "text": "上六：无号，终有凶。",
        "xiang": "无号之凶，终不可长也。",
        "sourceLocator": "周易/夬/易经/上六",
        "xiangLocator": "周易/夬/象/上六",
        "status": "checked"
      }

        "text": "九二：包有鱼，无咎，不利宾。",

        "sourceLocator": "周易/姤/易经/九二",
        "xiangLocator": "周易/姤/象/九二",

        "sourceLocator": "周易/姤/易经/九四",
        "xiangLocator": "周易/姤/象/九四",
        "status": "checked"
      },

        "text": "九五：以杞包瓜，含章，有陨自天。",
        "xiang": "九五含章，中正也。有陨自天，志不舍命也。",

        "xiangLocator": "周易/姤/象/九五",

        "sourceLocator": "周易/姤/易经/上九",

        "status": "checked"

  {

    "name": "艮",
    "guaci": "艮：艮其背，不获其身，行其庭，不见其人，无咎。",
    "tuan": "艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。",
    "daxiang": "兼山，艮；君子以思不出其位。",

        "text": "初六：艮其趾，无咎，利永贞。",

        "position": 2,
        "label": "六二",
        "text": "六二：艮其腓，不拯其随，其心不快。",

        "sourceLocator": "周易/艮/易经/六二",
        "xiangLocator": "周易/艮/象/六二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "九三",
        "text": "九三：艮其限，列其夤，厉熏心。",
        "xiang": "艮其限，危熏心也。",

        "xiangLocator": "周易/艮/象/九三",
        "status": "checked"

      {

        "label": "六四",
        "text": "六四：艮其身，无咎。",
        "xiang": "艮其身，止诸躬也。",

        "xiangLocator": "周易/艮/象/六四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "六五",
        "text": "六五：艮其辅，言有序，悔亡。",
        "xiang": "艮其辅，以中正也。",
        "sourceLocator": "周易/艮/易经/六五",
        "xiangLocator": "周易/艮/象/六五",
        "status": "checked"
      },

        "xiangLocator": "周易/艮/象/上九",

  {

    "name": "渐",

    "tuan": "渐之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位刚，得中也。止而巽，动不穷也。",
    "daxiang": "山上有木，渐；君子以居贤德，善俗。",

        "status": "checked"

        "position": 2,
        "label": "六二",
        "text": "六二：鸿渐于磐，饮食衎衎，吉。",

        "sourceLocator": "周易/渐/易经/六二",
        "xiangLocator": "周易/渐/象/六二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "九三",
        "text": "九三：鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。",
        "xiang": "夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。",
        "sourceLocator": "周易/渐/易经/九三",
        "xiangLocator": "周易/渐/象/九三",
        "status": "checked"
      },
      {
        "position": 4,
        "label": "六四",
        "text": "六四：鸿渐于木，或得其桷，无咎。",
        "xiang": "或得其桷，顺以巽也。",
        "sourceLocator": "周易/渐/易经/六四",
        "xiangLocator": "周易/渐/象/六四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "九五",
        "text": "九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。",
        "xiang": "终莫之胜，吉；得所愿也。",
        "sourceLocator": "周易/渐/易经/九五",
        "xiangLocator": "周易/渐/象/九五",
        "status": "checked"
      },
      {
        "position": 6,
        "label": "上九",
        "text": "上九：鸿渐于陆，其羽可用为仪，吉。",
        "xiang": "其羽可用为仪，吉；不可乱也。",
        "sourceLocator": "周易/渐/易经/上九",
        "xiangLocator": "周易/渐/象/上九",
        "status": "checked"
      }
    ],

  {

        "xiangLocator": "周易/归妹/象/九二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "六三",
        "text": "六三：归妹以须，反归以娣。",

        "xiangLocator": "周易/归妹/象/六三",
        "status": "checked"
      },
      {
        "position": 4,
        "label": "九四",
        "text": "九四：归妹愆期，迟归有时。",

        "xiangLocator": "周易/归妹/象/九四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "六五",
        "text": "六五：帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。",
        "xiang": "帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。",

        "xiangLocator": "周易/归妹/象/上六",

  {

    "lines": [

        "sourceLocator": "周易/丰/易经/六二",
        "xiangLocator": "周易/丰/象/六二",
        "status": "checked"
      },
      {
        "position": 3,
        "label": "九三",
        "text": "九三：丰其沛，日中见沫，折其右肱，无咎。",
        "xiang": "丰其沛，不可大事也。折其右肱，终不可用也。",
        "sourceLocator": "周易/丰/易经/九三",
        "xiangLocator": "周易/丰/象/九三",
        "status": "checked"
      },
      {
        "position": 4,
        "label": "九四",
        "text": "九四：丰其蔀，日中见斗，遇其夷主，吉。",
        "xiang": "丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉；行也。",
        "sourceLocator": "周易/丰/易经/九四",
        "xiangLocator": "周易/丰/象/九四",
        "status": "checked"
      },
      {
        "position": 5,
        "label": "六五",
        "text": "六五：来章，有庆誉，吉。",
        "xiang": "六五之吉，有庆也。",

        "xiangLocator": "周易/丰/象/六五",
        "status": "checked"

        "position": 6,
        "label": "上六",
        "text": "上六：丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。",
        "xiang": "丰其屋，天际翔也。窥其户，阒其无人，自藏也。",
        "sourceLocator": "周易/丰/易经/上六",
        "xiangLocator": "周易/丰/象/上六",

      }

      reversed:hexagramByCode[reversed].number,

    };

  <script>
const {trigrams,hexagrams}=window.ICHING_DATA;

function linesMarkup(code,detailView=false){
  return [...code].reverse().map(bit=>`<i class="yao ${bit==='1'?'yang':'yin'}"></i>`).join('');
}
function fullName(item){
  if(!item.upper)return `${item.name}为${item.nature}`;
  const upper=trigramByName[item.upper],lower=trigramByName[item.lower];
  return item.upper===item.lower?`${item.name}为${upper.nature}`:`${upper.nature}${lower.nature}${item.name}`;
}
function pronouncedNameMarkup(item,detailView=false){
  const characters=[...item.name];
  const syllables=item.pinyin.trim().split(/\s+/);
  return `<span class="name-pronunciation${detailView?' detail-name':''}" aria-label="${item.name}，读音${item.pinyin}">${characters.map((character,index)=>`<span class="pronounced-char"><small>${syllables[index]||''}</small><strong>${character}</strong></span>`).join('')}</span>`;
}
function classicText(text){
  return String(text||'').split('\n').map(part=>part.trim()).filter(Boolean).join('<br>');
}
const lineStages={1:'事情初始，力量刚刚显现',2:'进入发展阶段，重在回应与配合',3:'下卦将尽、进退交界，往往考验较多',4:'进入上卦，临近核心位置，行动需要审慎',5:'居于主位，通常关系整体方向与担当',6:'发展到极点，重点转向收束、反思或变化'};
function lineKeyword(line){
  return line.text.replace(new RegExp(`^${line.label}[：，,]?`),'').split(/[，。；！？]/)[0].replace(/[“”「」]/g,'').trim()||line.label;
}
function lineOutcome(text){
  if(/凶/.test(text))return '原文明示“凶”，表示风险较高，应先停止冒进并检查边界。';
  if(/元吉|大吉/.test(text))return '原文明示“元吉”或“大吉”，表示在所述条件成立时非常有利。';
  if(/吉/.test(text))return '原文含“吉”，表示依照相应条件处理，结果较为有利。';
  if(/无咎/.test(text))return '“无咎”表示按相应原则行动可以免于过失，并不等于过程毫无困难。';
  if(/悔亡/.test(text))return '“悔亡”表示及时调整之后，原有的悔恨或不利可以消退。';
  if(/厉/.test(text))return '“厉”表示处境存在危险，需要保持警惕。';
  if(/吝/.test(text))return '“吝”表示处境艰难、局促或可能留下遗憾。';
  return '原文没有用单一吉凶概括，宜结合完整爻辞与所问之事理解。';
}
function lineAction(line){
  if(/凶/.test(line.text))return '先控制风险，不以侥幸心理强行推进。';
  if(/无咎/.test(line.text))return '守住所述条件与分寸，谨慎执行即可。';
  if(/吉/.test(line.text))return '条件相合时可以推进，同时避免把有利局面使用过度。';
  if(/悔|吝|厉/.test(line.text))return '及时检查偏差，适当收敛或调整做法。';
  return line.position>=5?'留意盛极、收束与后续变化，不只看眼前结果。':'先辨明当前阶段，再决定进、退或等待。';
}
function lineExplanation(line){
  const keyword=lineKeyword(line);
  const stage=line.special?'六爻整体发生特定变化时参考':lineStages[line.position];
  const xiangPoint=line.xiang?line.xiang.replace(/^《?象》?曰[：，]?/,'').replace(/[“”「」]/g,''):'此项属于乾、坤的特殊辞，不对应单独一爻';
  return {keyword,stage,plain:`本爻以“${keyword}”作为主要意象。《小象》进一步说明：“${xiangPoint}”`,action:lineAction(line),outcome:lineOutcome(line.text)};
}

}

  if(isTrigram){
    const attributes=[['自然取象',item.nature],['卦德',item.virtue],['家庭角色',item.family],['后天方位',item.direction],['通行五行',item.element],['身体取象',item.body],['动物取象',item.animal]];
    return `${hero}<div class="detail-grid trigram-detail"><section class="detail-box wide"><h3>基本象义</h3><p class="key-meaning">${item.keywords}</p></section><section class="detail-box wide"><h3>传统取象</h3><div class="attribute-list">${attributes.map(([label,value])=>`<div><small>${label}</small><b>${value}</b></div>`).join('')}</div><p class="system-note">方位采用后天八卦方位；五行采用后世通行配属。</p></section><section class="detail-box wide classic-source"><h3>经典依据</h3><p>${item.classic}</p><small>依据：《易传·说卦》</small></section><section class="detail-box wide"><h3>简明解释</h3><p>${item.summary}</p></section><section class="detail-box wide"><h3>运用参考</h3><p>${item.advice}</p><small class="modern-note">本段为现代应用提示，不是《周易》原文或唯一解释。</small></section></div>`;
  }
  const composition=`<div class="components"><div class="component"><small>上卦</small><b>${item.upper} · ${trigramByName[item.upper].nature}</b></div><div class="component"><small>下卦</small><b>${item.lower} · ${trigramByName[item.lower].nature}</b></div></div>`;
  const summary=item.plainReading;
  const lineCards=item.lines.map(line=>{const info=lineExplanation(line);const locator=[line.sourceLocator,line.xiangLocator].filter(Boolean).join('；');return `<article class="line-card${line.special?' special-line':''}"><h4>${line.label}</h4><div class="line-original"><small>爻辞${line.special?'（特殊辞）':''}</small><p>${classicText(line.text)}</p></div>${line.xiang?`<div class="line-original"><small>《小象》原文</small><p>${classicText(line.xiang)}</p></div>`:''}<dl class="line-reading"><div><dt>关键词</dt><dd>${info.keyword}</dd></div><div><dt>所处阶段</dt><dd>${info.stage}</dd></div><div><dt>白话意思</dt><dd>${info.plain} ${info.outcome}</dd></div><div><dt>行动提醒</dt><dd>${info.action}</dd></div>${locator?`<div class="source-locator"><dt>资料定位</dt><dd>${locator}</dd></div>`:''}</dl></article>`}).join('');
  const relations=`<div class="relation-list">${relationCard('互卦',item.relations.nuclear,'取二三四爻为下卦、三四五爻为上卦')}${relationCard('错卦',item.relations.opposite,'六爻阴阳全部相反')}${relationCard('综卦',item.relations.reversed,item.relations.reversed===item.number?'上下倒置后仍为本卦':'把整个卦象上下倒置')}${item.relations.previous?relationCard('前一卦',item.relations.previous,'《周易》通行卦序'):''}${item.relations.next?relationCard('后一卦',item.relations.next,'《周易》通行卦序'):''}</div>`;
  const sourceUrl=`https://zh.wikisource.org/wiki/${encodeURIComponent(`周易/${item.name}`)}`;
  const variantNote=item.variants.length?`本卦资料中保留的异文标记：${item.variants.join('、')}。异文并列展示，不擅自判定只有一种写法。`:'当前整理文本未标出需要单列的常见异文；不同古本仍可能存在文字差异。';
  const sourceLocators=[item.source.guaciLocator,item.source.tuanLocator,item.source.daxiangLocator].filter(Boolean).join('；');
  return `${hero}<div class="detail-grid hexagram-detail"><section class="detail-box wide"><h3>卦象组成</h3>${composition}</section><section class="detail-box"><h3>核心主题</h3><p class="key-meaning">${item.theme}</p></section><section class="detail-box"><h3>卦名由来</h3><p>${item.nameOrigin}</p><small class="modern-note">依据卦体与传世易学的通行解释，不作为唯一的文字学结论。</small></section><section class="detail-box classic-source"><h3>卦辞原文</h3><p>${classicText(item.guaci)}</p><small>《周易》经文</small></section><section class="detail-box classic-source"><h3>《象传》大象</h3><p>${classicText(item.daxiang)}</p><small>由上下卦取象，并说明君子如何效法。</small></section><section class="detail-box wide classic-source"><h3>《彖传》原文</h3><p>${classicText(item.tuan)}</p><small>传统卦义说明</small></section><section class="detail-box"><h3>专属白话解读</h3><p>${summary}</p><small class="modern-note">现代概括，不是《周易》原文或唯一解释。</small></section><section class="detail-box"><h3>行动参考</h3><p>${item.advice}</p><small class="modern-note">一般性参考，不能代替现实中的事实判断或专业意见。</small></section><section class="detail-box wide"><h3>卦象关系</h3>${relations}<p class="system-note">互卦、错卦和综卦均由当前六爻卦画自动计算；点击卡片可直接查看对应卦。</p></section><section class="detail-box wide lines-section"><div class="section-title-row"><div><h3>六爻逐条解读</h3><p>从初爻到上爻排列；原文、传文与现代提示严格分区。</p></div><span>${item.lines.length} 条</span></div><div class="line-list">${lineCards}</div></section><section class="detail-box wide reading-guide"><h3>解卦使用说明</h3><ol><li><b>本卦：</b>先看整体处境，参考卦辞、彖传和大象。</li><li><b>动爻：</b>表示当前变化的关键位置，重点看对应爻辞与小象。</li><li><b>变卦：</b>观察变化后可能呈现的方向，不等于必然发生的结果。</li><li><b>无动爻：</b>通常以本卦整体为主；一爻动时重点参考该爻。多爻动的取法各传统并不完全一致，应明确采用的规则，不把一种方法说成唯一标准。</li></ol></section><section class="detail-source-note wide"><b>出处与校勘说明</b><p>卦辞、爻辞、彖传和象传据维基文库《周易》简体页面整理，资料状态：${item.source.status==='checked'?'已按来源检查':'待复核'}。${variantNote}</p>${sourceLocators?`<p class="source-path">资料定位：${sourceLocators}</p>`:''}<a href="${sourceUrl}" target="_blank" rel="noopener">查看本卦经典来源 ↗</a></section></div>`;
}
function openDetail(type,number,updateHash=true){
  const list=type==='trigram'?trigrams:hexagrams,item=list.find(entry=>entry.number===number);
  if(!item)return;
  detail.innerHTML=detailMarkup(item,type);
  catalogPage.hidden=true;
  detailPage.hidden=false;
  document.body.classList.add('detail-mode');
  window.scrollTo(0,0);
  if(updateHash)history.pushState({fromCatalog:true,view:currentView},'',`#${type}-${number}`);
}
function closeDetail(){
  detailPage.hidden=true;
  catalogPage.hidden=false;
  document.body.classList.remove('detail-mode');
  history.replaceState(null,'',location.pathname+location.search);
  window.scrollTo(0,0);
}
function routeFromAddress(){
  const match=location.hash.match(/^#(trigram|hexagram)-(\d+)$/);
  if(match){
    const view=match[1]==='trigram'?'trigrams':'hexagrams';
    renderDirectory(view);
    openDetail(match[1],Number(match[2]),false);
  }else{
    detailPage.hidden=true;
    catalogPage.hidden=false;
    document.body.classList.remove('detail-mode');
  }
}

document.querySelector('.tabs').addEventListener('click',event=>{const button=event.target.closest('.tab');if(button)renderDirectory(button.dataset.view)});
directory.addEventListener('click',event=>{const card=event.target.closest('.gua-card');if(card)openDetail(card.dataset.type,Number(card.dataset.number))});
detail.addEventListener('click',event=>{const related=event.target.closest('[data-related]');if(related)openDetail('hexagram',Number(related.dataset.related))});
document.getElementById('backToDirectory').addEventListener('click',closeDetail);
window.addEventListener('popstate',routeFromAddress);

renderDirectory('trigrams');
routeFromAddress();

  </script>
</body>
</html>
