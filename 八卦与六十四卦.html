    ['革','gé','改革更新','旧方式已不适用，变化需要正当时机和清楚共识。'],
    ['鼎','dǐng','更新成器','通过重新组合资源实现升级，重视核心能力。'],
    ['震','zhèn','震动警醒','突发变化带来惊动，先稳住再迅速回应。'],
    ['艮','gèn','停止安定','知道何时停止，安静下来才能看清边界。'],
    ['渐','jiàn','循序渐进','变化需要过程，稳定步骤胜过急于求成。'],
    ['归妹','guī mèi','位置未稳','关系或条件不完全匹配，尤其要守礼并明确边界。'],
    ['丰','fēng','丰盛高峰','成果明显但高峰难久，及时管理和分享。'],
    ['旅','lǚ','旅途暂居','环境具有临时性，保持灵活并尊重当地规则。'],
    ['巽','xùn','柔顺深入','用温和、反复的方式进入问题，避免摇摆不定。'],
    ['兑','duì','喜悦交流','沟通和互惠有利，但要防止只说好听的话。'],
    ['涣','huàn','涣散疏通','先化解隔阂、重新聚拢人心和资源。'],
    ['节','jié','节制边界','设置适度规则可以长久，过严也会造成压力。'],
    ['中孚','zhōng fú','诚信感通','信任来自内外一致，承诺必须能够兑现。'],
    ['小过','xiǎo guò','小事谨慎','适合处理局部和细节，大动作需要更加保守。'],
    ['既济','jì jì','已经完成','成果初成，最需要防止松懈和细节反复。'],
    ['未济','wèi jì','尚未完成','仍在过渡期，谨慎完成最后步骤，不宜提前庆祝。']
  ];

  const codes = trigrams.map(item => item.code);
  const byCode = Object.fromEntries(trigrams.map(item => [item.code, item]));
  const byLower = {
    '111':[1,43,14,34,9,5,26,11], '110':[10,58,38,54,61,60,41,19],
    '101':[13,49,30,55,37,63,22,36], '100':[25,17,21,51,42,3,27,24],
    '011':[44,28,50,32,57,48,18,46], '010':[6,47,64,40,59,29,4,7],
    '001':[33,31,56,62,53,39,52,15], '000':[12,45,35,16,20,8,23,2]
  };
  const positions = {};
  Object.entries(byLower).forEach(([lower,numbers]) => numbers.forEach((number,index) => {
    positions[number] = {upper:codes[index], lower};
  }));
  const hexagrams = text.slice(1).map((item,index) => {
    const number=index+1, position=positions[number], upper=byCode[position.upper], lower=byCode[position.lower];
    return {number,name:item[0],pinyin:item[1],theme:item[2],advice:item[3],upper:upper.name,lower:lower.name,code:position.lower+position.upper};
  });
  return {trigrams,hexagrams};
})();

  </script>

  <!-- ===== 功能区：目录切换、点击和弹窗逻辑 ===== -->
  <script>
const {trigrams,hexagrams}=window.ICHING_DATA;
const directory=document.getElementById('directory');
const catalogPage=document.getElementById('catalogPage');
const detailPage=document.getElementById('detailPage');
const detail=document.getElementById('detailContent');
const sectionTitle=document.getElementById('sectionTitle');
const sectionKicker=document.getElementById('sectionKicker');
const sectionNote=document.getElementById('sectionNote');
const trigramByName=Object.fromEntries(trigrams.map(item=>[item.name,item]));
let currentView='trigrams';

function linesMarkup(code,detailView=false){
  return [...code].reverse().map(bit=>`<i class="yao ${bit==='1'?'yang':'yin'}"></i>`).join('');
}
function fullName(item){
  if(!item.upper)return `${item.name}为${item.nature}`;
  const upper=trigramByName[item.upper],lower=trigramByName[item.lower];
  return item.upper===item.lower?`${item.name}为${upper.nature}`:`${upper.nature}${lower.nature}${item.name}`;
}
function pronouncedNameMarkup(item,detailView=false){
  const characters=[...item.name];
  const syllables=item.pinyin.trim().split(/\s+/);
  return `<span class="name-pronunciation${detailView?' detail-name':''}" aria-label="${item.name}，读音${item.pinyin}">${characters.map((character,index)=>`<span class="pronounced-char"><small>${syllables[index]||''}</small><strong>${character}</strong></span>`).join('')}</span>`;
}
function cardMarkup(item,type){
  const secondary=type==='trigram'?`${item.nature} · ${item.element}`:fullName(item);
  return `<button class="gua-card" type="button" data-type="${type}" data-number="${item.number}" aria-label="查看第${item.number}${type==='trigram'?'基础卦':'卦'}${item.name}，读音${item.pinyin}">
    <span class="gua-number">${String(item.number).padStart(2,'0')}</span>
    <span class="gua-lines" aria-hidden="true">${linesMarkup(item.code)}</span>
    <span class="gua-label">${pronouncedNameMarkup(item)}<span>${secondary}</span></span>
  </button>`;
}
function renderDirectory(view){
  currentView=view;
  const isTrigram=view==='trigrams',items=isTrigram?trigrams:hexagrams,type=isTrigram?'trigram':'hexagram';
  sectionKicker.textContent=isTrigram?'八经卦':'通行卦序';
  sectionTitle.textContent=isTrigram?'八个基础卦':'周易六十四卦';
  sectionNote.textContent=isTrigram?'梅花易数常用数序：乾一、兑二、离三、震四、巽五、坎六、艮七、坤八。':'每个六爻卦都由一个上卦和一个下卦组成；编号采用《周易》通行卦序。';
  directory.innerHTML=items.map(item=>cardMarkup(item,type)).join('');
  document.querySelectorAll('.tab').forEach(button=>{const active=button.dataset.view===view;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});
}
function detailMarkup(item,type){
  const isTrigram=type==='trigram';
  const hero=`<div class="detail-hero"><div class="detail-symbol" aria-hidden="true">${linesMarkup(item.code,true)}</div><div class="detail-meta"><span>第 ${item.number} ${isTrigram?'基础卦':'卦'}</span>${pronouncedNameMarkup(item,true)}<span class="full-name">${fullName(item)}</span></div></div>`;
  if(isTrigram){
    const attributes=[['自然取象',item.nature],['卦德',item.virtue],['家庭角色',item.family],['后天方位',item.direction],['通行五行',item.element],['身体取象',item.body],['动物取象',item.animal]];
    return `${hero}<div class="detail-grid trigram-detail"><section class="detail-box wide"><h3>基本象义</h3><p class="key-meaning">${item.keywords}</p></section><section class="detail-box wide"><h3>传统取象</h3><div class="attribute-list">${attributes.map(([label,value])=>`<div><small>${label}</small><b>${value}</b></div>`).join('')}</div><p class="system-note">方位采用后天八卦方位；五行采用后世通行配属。</p></section><section class="detail-box wide classic-source"><h3>经典依据</h3><p>${item.classic}</p><small>依据：《易传·说卦》</small></section><section class="detail-box wide"><h3>简明解释</h3><p>${item.summary}</p></section><section class="detail-box wide"><h3>运用参考</h3><p>${item.advice}</p><small class="modern-note">本段为现代应用提示，不是《周易》原文或唯一解释。</small></section></div>`;
  }
  const composition=`<div class="components"><div class="component"><small>上卦</small><b>${item.upper} · ${trigramByName[item.upper].nature}</b></div><div class="component"><small>下卦</small><b>${item.lower} · ${trigramByName[item.lower].nature}</b></div></div>`;
  const summary=`${fullName(item)}由上卦${item.upper}与下卦${item.lower}组成。核心主题是“${item.theme}”。`;
  return `${hero}<div class="detail-grid"><section class="detail-box wide"><h3>卦象组成</h3>${composition}</section><section class="detail-box"><h3>核心含义</h3><p>${item.theme}</p></section><section class="detail-box"><h3>卦象理解</h3><p>${summary}</p></section><section class="detail-box wide"><h3>行动参考</h3><p>${item.advice}</p></section></div>`;
}
function openDetail(type,number,updateHash=true){
  const list=type==='trigram'?trigrams:hexagrams,item=list.find(entry=>entry.number===number);
  if(!item)return;
  detail.innerHTML=detailMarkup(item,type);
  catalogPage.hidden=true;
  detailPage.hidden=false;
  document.body.classList.add('detail-mode');
  window.scrollTo(0,0);
  if(updateHash)history.pushState({fromCatalog:true,view:currentView},'',`#${type}-${number}`);
}
function closeDetail(){
  detailPage.hidden=true;
  catalogPage.hidden=false;
  document.body.classList.remove('detail-mode');
  history.replaceState(null,'',location.pathname+location.search);
  window.scrollTo(0,0);
}
function routeFromAddress(){
  const match=location.hash.match(/^#(trigram|hexagram)-(\d+)$/);
  if(match){
    const view=match[1]==='trigram'?'trigrams':'hexagrams';
    renderDirectory(view);
    openDetail(match[1],Number(match[2]),false);
  }else{
    detailPage.hidden=true;
    catalogPage.hidden=false;
    document.body.classList.remove('detail-mode');
  }
}

document.querySelector('.tabs').addEventListener('click',event=>{const button=event.target.closest('.tab');if(button)renderDirectory(button.dataset.view)});
directory.addEventListener('click',event=>{const card=event.target.closest('.gua-card');if(card)openDetail(card.dataset.type,Number(card.dataset.number))});
document.getElementById('backToDirectory').addEventListener('click',closeDetail);
window.addEventListener('popstate',routeFromAddress);

renderDirectory('trigrams');
routeFromAddress();

  </script>
</body>
</html>
