<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">象数 · 观变</p>
      <h1>梅花易数</h1>
      <p>以时间、数字或已知卦象起卦，查看本卦、互卦、变卦与体用关系。</p>
    </header>

    <section class="card">
      <label for="question">所问事项</label>
      <textarea id="question" maxlength="100" placeholder="一次只问一件具体的事"></textarea>
      <label for="topicType" class="topic-label">所问类型</label>
      <select id="topicType">
        <option value="general">综合事项</option>
        <option value="career">事业工作</option>
        <option value="wealth">财务求财</option>
        <option value="love">感情关系</option>
        <option value="study">学习考试</option>
        <option value="health">健康生活</option>
      </select>
    </section>

    <section class="card">
      <div class="tabs" role="tablist">
        <button class="tab active" data-mode="time">时间起卦</button>
        <button class="tab" data-mode="numbers">双数起卦</button>
        <button class="tab" data-mode="manual">手动起卦</button>
      </div>

      <div id="timePanel" class="panel">
        <label for="castTime">起卦时间</label>
        <div class="datetime-shell"><input id="castTime" type="datetime-local"></div>
        <button id="nowButton" class="secondary">使用当前时间</button>
        <label for="timeDayBoundary" class="time-rule-label">子时换日规则</label>
        <select id="timeDayBoundary"><option value="midnight">午夜换日（00:00换日）</option><option value="zi">子初换日（23:00换日）</option></select>
        <p class="note">自动读取设备当地时间；手动输入时请填写事情发生地的当地时间。按农历年支数＋月＋日定上卦，再加时支数定下卦与动爻。</p>
      </div>

      <div id="numbersPanel" class="panel" hidden>
        <div class="field-grid">
          <div><label for="firstNumber">第一个数（上卦）</label><input id="firstNumber" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="100"></div>
          <div><label for="secondNumber">第二个数（下卦）</label><input id="secondNumber" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="100"></div>
        </div>
        <p class="note">两个数可以位数不同，但必须是正整数（每个最多100位）。两数相加除以6所得余数确定动爻。</p>
      </div>

      <div id="manualPanel" class="panel" hidden>
        <div class="manual-grid">
          <div><label for="upperSelect">上卦</label><select id="upperSelect"></select></div>
          <div><label for="lowerSelect">下卦</label><select id="lowerSelect"></select></div>
          <div><label for="movingSelect">动爻</label><select id="movingSelect"><option value="1">初爻</option><option value="2">二爻</option><option value="3">三爻</option><option value="4">四爻</option><option value="5">五爻</option><option value="6">上爻</option></select></div>
        </div>
        <p class="note">用于录入已经得到的卦象或检查计算；它不是另一种随机方式。</p>
      </div>

      <p id="error" class="error" hidden></p>
      <button id="castButton" class="primary">生成卦象</button>
    </section>

    <section id="result" class="result" hidden></section>

    <footer>本工具采用内置规则进行结构化解读，全程可离线使用。内容用于传统文化学习与自我反思，不作为医疗、投资、法律或其他专业结论。</footer>
  </main>

function bigRemainderText(value,base){const r=value%BigInt(base);return r===0n?`余0，按${base}处理`:`余${r}`}
function trigram(n){return trigrams[n-1]}
function lookup(upper,lower){const rec=hexagramMap[`${upper.bits}-${lower.bits}`];return{number:rec[0],name:rec[1],fullName:upper.bits===lower.bits?`${rec[1]}为${upper.nature}`:`${upper.nature}${lower.nature}${rec[1]}`,upper,lower}}
function linesOf(upper,lower){return[...lower.bits,...upper.bits].map(x=>x==='1')}
function fromLines(lines){const lower=byBits[lines.slice(0,3).map(Number).join('')],upper=byBits[lines.slice(3).map(Number).join('')];return lookup(upper,lower)}
function mutual(lines){return fromLines([lines[1],lines[2],lines[3],lines[2],lines[3],lines[4]])}
function changed(lines,moving){const copy=[...lines];copy[moving-1]=!copy[moving-1];return fromLines(copy)}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function chineseDateParts(date){
  const formatter=new Intl.DateTimeFormat('zh-CN-u-ca-chinese',{year:'numeric',month:'numeric',day:'numeric'});
  const parts=formatter.formatToParts(date);
  const get=type=>parts.find(x=>x.type===type)?.value;
  const year=Number(get('relatedYear'));
  const monthText=get('month')||'';
  const day=Number(get('day'));
  const monthNames={'正':1,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'冬':11,'十二':12,'腊':12};
  const cleanMonth=monthText.replace(/[闰月]/g,'');
  const month=/^\d+$/.test(cleanMonth)?Number(cleanMonth):monthNames[cleanMonth];
  if(!year||!month||!day)throw new Error('当前浏览器无法完成农历转换，请改用双数或手动起卦。');
  const yearBranch=remainder(year-3,12);
  const hour=date.getHours();
  const hourBranch=Math.floor(((hour+1)%24)/2)+1;
  return{year,month,day,yearBranch,hourBranch,branch:branchNames[hourBranch-1],leap:/闰/.test(monthText)};
}

function calculate(){
  if(mode==='numbers'){
    const aText=el('firstNumber').value.trim(),bText=el('secondNumber').value.trim();
    if(!/^\d+$/.test(aText)||!/^\d+$/.test(bText))throw new Error('请输入两个有效的正整数。');
    if(aText.length>100||bText.length>100)throw new Error('每个数字最多输入100位。');
    const a=BigInt(aText),b=BigInt(bText);
    if(a<1n||b<1n)throw new Error('请输入两个有效的正整数。');
    const total=a+b;
    return{upper:trigram(bigRemainder(a,8)),lower:trigram(bigRemainder(b,8)),moving:bigRemainder(total,6),process:`${a} ÷ 8 ${bigRemainderText(a,8)}；${b} ÷ 8 ${bigRemainderText(b,8)}；两数之和 ${total} ÷ 6 ${bigRemainderText(total,6)}。`,time:'双数起卦'};
  }
  if(mode==='manual'){
    const upper=trigram(Number(el('upperSelect').value)),lower=trigram(Number(el('lowerSelect').value)),moving=Number(el('movingSelect').value);
    return{upper,lower,moving,process:`手动选择上卦${upper.name}、下卦${lower.name}、${['初','二','三','四','五','上'][moving-1]}爻动。`,time:'手动起卦'};
  }
  if(!el('castTime').value)throw new Error('请选择起卦时间。');
  const date=new Date(el('castTime').value);
  if(Number.isNaN(date.getTime()))throw new Error('起卦时间无效。');
  const ziBoundary=el('timeDayBoundary').value==='zi',calendarDate=new Date(date.getTime()),nextDay=ziBoundary&&date.getHours()===23;
  if(nextDay)calendarDate.setDate(calendarDate.getDate()+1);
  const p=chineseDateParts(calendarDate),base=p.yearBranch+p.month+p.day,total=base+p.hourBranch;
  const boundaryText=ziBoundary?'子初换日（23:00换日）':'午夜换日（00:00换日）';
  return{upper:trigram(remainder(base,8)),lower:trigram(remainder(total,8)),moving:remainder(total,6),process:`${boundaryText}${nextDay?'，本次23时按次日计算':''}。农历${p.year}年${p.leap?'闰':''}${p.month}月${p.day}日，年支数${p.yearBranch}，${p.branch}时数${p.hourBranch}。上卦数：${p.yearBranch}+${p.month}+${p.day}=${base}；下卦及动爻总数：${base}+${p.hourBranch}=${total}。`,time:el('castTime').value.replace('T',' ')};
}

function relation(body,use){
  if(body.element===use.element)return`体用比和（同为${body.element}），象征彼此协调、同类相助。`;
  const produces={木:'火',火:'土',土:'金',金:'水',水:'木'};
  const controls={木:'土',土:'水',水:'火',火:'金',金:'木'};
  if(produces[use.element]===body.element)return`用生体：用卦${use.element}生体卦${body.element}，通常视为外部条件有所助益。`;
  if(produces[body.element]===use.element)return`体生用：体卦${body.element}生用卦${use.element}，通常表示自身有所付出或消耗。`;
  if(controls[body.element]===use.element)return`体克用：体卦${body.element}克用卦${use.element}，通常表示自身能够制约或推动所问之事。`;
  return`用克体：用卦${use.element}克体卦${body.element}，通常提示外部压力或阻力。`;
}

function elementRelationAdvice(body,use){
  if(body.element===use.element)return`体用同属${body.element}，双方较容易协调，但仍需用实际行动维持一致。`;
  const produces={木:'火',火:'土',土:'金',金:'水',水:'木'};
  const controls={木:'土',土:'水',水:'火',火:'金',金:'木'};
  if(produces[use.element]===body.element)return`用卦生体，外部条件对自身有支持，可主动承接但不要完全依赖。`;
  if(produces[body.element]===use.element)return`体卦生用，自己可能需要投入更多时间、精力或资源，应先衡量承受能力。`;
  if(controls[body.element]===use.element)return`体卦克用，自身有推动或管理空间，但过程需要持续用力。`;
  return`用卦克体，外部压力较强，宜降低风险、寻求帮助并保留余地。`;
}

function readingMarkup(base,middle,change,lines,data,body,use){
  const baseText=hexagramReadings[base.number],middleText=hexagramReadings[middle.number],changeText=hexagramReadings[change.number];
  const topic=topicGuides[el('topicType').value]||topicGuides.general;
  const direction=lines[data.moving-1]?'本爻由阳转阴，象征由主动、扩张转向收敛、协调。':'本爻由阴转阳，象征由观察、承接转向行动、明确。';
  return`<section class="reading"><div class="reading-title"><small>离线结构化解卦 · ${topic[0]}</small><h3>${base.fullName}之${change.fullName}</h3></div><div class="reading-grid"><div class="reading-item"><b>本卦 · 当前状态</b><p><strong>${baseText[0]}</strong>：${baseText[1]}</p></div><div class="reading-item"><b>互卦 · 内部过程</b><p><strong>${middleText[0]}</strong>：${middleText[1]}</p></div><div class="reading-item"><b>动爻 · 关键转折</b><p>${movingPositions[data.moving-1]}${direction}</p></div><div class="reading-item"><b>变卦 · 变化方向</b><p><strong>${changeText[0]}</strong>：${changeText[1]}</p></div><div class="reading-item"><b>体卦 · 自身</b><p>${body.name}为${body.nature}，五行属${body.element}，代表自身所处位置与承受能力。</p></div><div class="reading-item"><b>用卦 · 所问之事</b><p>${use.name}为${use.nature}，五行属${use.element}。${elementRelationAdvice(body,use)}</p></div></div><div class="reading-summary"><b>${topic[0]}综合提示</b><p>当前主题是“${baseText[0]}”，内部经过“${middleText[0]}”，随后趋向“${changeText[0]}”。${topic[1]}结合动爻位置，先处理最关键的一步，再根据实际反馈调整。</p></div><p class="reading-caution">这是依据卦象结构和内置规则生成的传统文化解释，不代表确定预言；重要决定仍应依据事实和专业意见。</p></section>`;
}

function lineMarkup(lines,moving=0){return lines.slice().reverse().map((yang,i)=>`<div class="line ${yang?'yang':'yin'}">${moving===6-i?`<em>${yang?'○':'×'}</em>`:''}</div>`).join('')}
function card(role,hex,lines,moving=0){return`<div class="hex-card"><span class="role">${role}</span><div class="lines">${lineMarkup(lines,moving)}</div><h3>${hex.name}</h3><p>${hex.fullName} · 第${hex.number}卦</p></div>`}
function renderResult(data){
  const base=lookup(data.upper,data.lower),lines=linesOf(data.upper,data.lower),middle=mutual(lines),change=changed(lines,data.moving);
  const middleLines=linesOf(middle.upper,middle.lower),changedLines=[...lines];changedLines[data.moving-1]=!changedLines[data.moving-1];
  const movingInLower=data.moving<=3,body=movingInLower?data.upper:data.lower,use=movingInLower?data.lower:data.upper;
  el('result').innerHTML=`<div class="result-head"><span>${mode==='time'?'时间起卦':mode==='numbers'?'双数起卦':'手动起卦'}</span><span>${data.time}</span></div>${el('question').value.trim()?`<p class="question">“${escapeHtml(el('question').value.trim())}”</p>`:''}<div class="process">${data.process}</div><div class="hex-grid">${card('本卦',base,lines,data.moving)}${card('互卦',middle,middleLines)}${card('变卦',change,changedLines)}</div><div class="body-grid"><div class="body-box"><small>体卦 · 自身</small><h4>${body.name}为${body.nature} · ${body.element}</h4><p>动爻位于${movingInLower?'下卦':'上卦'}，因此不动的${movingInLower?'上卦':'下卦'}取为体。</p></div><div class="body-box"><small>用卦 · 所问之事</small><h4>${use.name}为${use.nature} · ${use.element}</h4><p>发生变化的${movingInLower?'下卦':'上卦'}取为用。</p></div></div><div class="relation"><b>体用关系：</b>${relation(body,use)}</div>${readingMarkup(base,middle,change,lines,data,body,use)}`;
  el('result').hidden=false;setTimeout(()=>el('result').scrollIntoView({behavior:'smooth',block:'start'}),50);
}

function setNow(){el('castTime').value=localDateTime()}
trigrams.forEach(t=>{const text=`${t.n} · ${t.name}（${t.nature}／${t.element}）`;el('upperSelect').add(new Option(text,t.n));el('lowerSelect').add(new Option(text,t.n))});
setNow();el('upperSelect').value='1';el('lowerSelect').value='8';
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));Object.entries(panels).forEach(([key,panel])=>panel.hidden=key!==mode);el('error').hidden=true}));
el('nowButton').addEventListener('click',setNow);
el('castButton').addEventListener('click',()=>{try{el('error').hidden=true;renderResult(calculate())}catch(error){el('error').textContent=error.message;el('error').hidden=false;el('result').hidden=true}});

</script>
